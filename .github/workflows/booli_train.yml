name: Booli ML Training

on:
  workflow_run:
    workflows: ["Booli Data Retriever"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: booli-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Train model
        env:
          BOOLI_N_TRIALS: '30'
        run: python scripts/booli_train.py --trials $BOOLI_N_TRIALS

      - name: Commit updated model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/production/
          git diff --cached --quiet && echo "No model changes" && exit 0
          git commit -m "chore: retrain booli price model $(date -u +%Y-%m-%d)"
          git push
