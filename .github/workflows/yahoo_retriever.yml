name: Yahoo Finance Retriever

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 06:00 UTC weekdays (markets closed on weekends)
  workflow_dispatch:          # allow manual runs from the Actions tab

concurrency:
  group: yahoo-retriever
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Yahoo retriever
        env:
          YAHOO_MARKETS: 'nasdaq_omx,sp500'
          YAHOO_OUTPUT_DIR: data/yahoo/delta
        run: python scripts/yahoo_retriever.py

      - name: Commit and push Delta files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yahoo/delta/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: yahoo data ingest $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
